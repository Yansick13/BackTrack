{% extends "base.html" %}
{% block title %}Sign In | BackTrack{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-header bg-dark text-white text-center py-3 rounded-top-4">
        <h4 class="mb-0 fw-bold">BackTrack Sign In</h4>
        <small class="text-secondary">UWI Mona Students, Staff &amp; Campus Police</small>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Campus Email</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="name@mymona.uwi.edu">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
          </div>
          <button type="submit" class="btn btn-uwi w-100 fw-bold py-2">Sign In</button>
        </form>

        <!-- Helpful Demo Credentials Box -->
        <div class="mt-4 p-3 bg-light rounded-3 border small">
          <div class="fw-bold text-uppercase text-muted mb-1">Demo Credentials (from seed.py)</div>
          <div><strong>Student:</strong> <code>student@mymona.uwi.edu</code> / <code>student123</code></div>
          <div><strong>Police Admin:</strong> <code>police@uwimona.edu.jm</code> / <code>police123</code></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
